name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the toolchain image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-cache/toolchain
          key: toolchain-image-${{ hashFiles('Containerfile', '.zig-version', 'tests/e2e/lib/image.sh') }}
      - name: Build the toolchain image
        env:
          IMAGE_CACHE_DIR: ${{ runner.temp }}/image-cache/toolchain
        run: packaging/build-toolchain.sh
      - name: Check formatting
        run: podman run --rm -v "$PWD":/src:Z -w /src fake-systemd-build zig fmt --check build.zig src tests
      - name: Run unit, golden and integration tests
        run: podman run --rm -v "$PWD":/src:Z -w /src fake-systemd-build zig build test

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - arm-linux-musleabihf
          - riscv64-linux-musl
          - x86-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the toolchain image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-cache/toolchain
          key: toolchain-image-${{ hashFiles('Containerfile', '.zig-version', 'tests/e2e/lib/image.sh') }}
      - name: Build the toolchain image
        env:
          IMAGE_CACHE_DIR: ${{ runner.temp }}/image-cache/toolchain
        run: packaging/build-toolchain.sh
      - name: Build the release tarball
        env:
          TARGET: ${{ matrix.target }}
        run: packaging/build-tarball.sh "$TARGET" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  e2e:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [dinit, runit, openrc, s6, sysvinit, "66", busybox, bsdrc, procd, finit, shepherd, nosh]
    # nosh is experimental: its suite needs SYS_ADMIN inside the rootless user namespace.
    continue-on-error: ${{ matrix.suite == 'nosh' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the toolchain image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-cache/toolchain
          key: toolchain-image-${{ hashFiles('Containerfile', '.zig-version', 'tests/e2e/lib/image.sh') }}
      - name: Build the toolchain image
        env:
          IMAGE_CACHE_DIR: ${{ runner.temp }}/image-cache/toolchain
        run: packaging/build-toolchain.sh
      - name: Cache the nosh packages
        if: matrix.suite == 'nosh'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/e2e/nosh/debs
          key: nosh-debs-${{ hashFiles('tests/e2e/nosh/debs.sha256') }}
      - name: Fetch the nosh packages
        if: matrix.suite == 'nosh'
        run: tests/e2e/nosh/fetch-debs.sh
      - name: Restore the suite images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-cache/suite
          key: e2e-images-${{ matrix.suite }}-${{ hashFiles(format('tests/e2e/{0}/**', matrix.suite), 'tests/e2e/lib/image.sh') }}
          restore-keys: e2e-images-${{ matrix.suite }}-
      - name: Run the ${{ matrix.suite }} end-to-end test
        env:
          IMAGE_CACHE_DIR: ${{ runner.temp }}/image-cache/suite
        run: tests/e2e/${{ matrix.suite }}/run.sh
